<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--blue:#1a1a2e;--blue2:#16213e;--accent:#4a90e2;--gk:#c8f7c5;--gv:#1a5c1a;--rk:#ffd6d6;--rv:#8b0000;--brd:#e0e6f0;--prod:#2a78d6;--rob:#7f4fd8;--util:#eb6834}
html,body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:#f0f2f5;color:#1a1a2e;-webkit-text-size-adjust:100%}
header{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;padding:14px 16px}
header h1{font-size:1rem;font-weight:700;line-height:1.4}
header span{opacity:.65;font-weight:400;font-size:.82rem}
.panel{background:#fff;padding:14px 16px;border-bottom:2px solid var(--brd)}
.panel h2{font-size:.88rem;font-weight:700;color:#333;margin-bottom:10px}
.period-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.pbtn{flex:1 1 auto;min-width:68px;background:var(--blue);color:#fff;border:none;border-radius:8px;padding:9px 10px;font-size:.78rem;font-weight:600;cursor:pointer;opacity:.4}
.pbtn.active{opacity:1;background:var(--accent)}
.row{display:flex;gap:8px}
#idInput{flex:1;min-width:0;border:2px solid var(--accent);border-radius:10px;padding:13px;font-size:1.3rem;font-weight:700;font-family:monospace;color:var(--accent);background:#fff;outline:none}
#goBtn{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:0 20px;font-size:1rem;font-weight:800;cursor:pointer;min-width:66px;touch-action:manipulation}
#goBtn:active{background:#2370cc}
#errMsg{display:none;margin-top:10px;padding:10px 12px;border-radius:8px;background:#ffeaea;border:1px solid #ffb3b3;color:#b00;font-size:.86rem;font-weight:600}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:11px;padding-top:10px;border-top:1px solid var(--brd)}
.li{display:flex;align-items:center;gap:5px;font-size:.75rem;color:#555}
.dot{width:12px;height:12px;border-radius:3px}
.dg{background:#c8f7c5;border:1px solid #5cb85c}.dr{background:#ffd6d6;border:1px solid #d9534f}.dx{background:#f0f0f0;border:1px solid #ccc}
.content{padding:12px 16px}
.empty{text-align:center;padding:56px 16px;color:#bbb}
.empty .ico{font-size:2.8rem;margin-bottom:10px}
.empty p{font-size:.88rem;line-height:1.6}
.empty strong{color:var(--accent)}
.card{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#eef5ff;border:1.5px solid #b8d4f5;border-radius:10px;padding:10px 14px;margin-bottom:10px}
.cid{font-family:monospace;color:var(--accent);font-size:1.05rem;font-weight:800}
.badge{font-size:.68rem;font-weight:700;padding:3px 9px;border-radius:10px;background:#d4f8d4;color:#1a6b1a}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:8px;margin-bottom:10px}
.kpi{background:#fff;border:1px solid var(--brd);border-radius:10px;padding:9px 11px}
.kpi .l{font-size:.66rem;color:#888;margin-bottom:2px;line-height:1.3}
.kpi .v{font-size:1.1rem;font-weight:800}
.chartbox{background:#fff;border:1px solid var(--brd);border-radius:10px;padding:12px 10px 6px;margin-bottom:10px}
.chartbox h3{font-size:.76rem;font-weight:700;color:#555;margin:0 0 2px 4px}
.clg{display:flex;gap:14px;flex-wrap:wrap;margin:0 0 6px 4px}
.clg span{display:flex;align-items:center;gap:5px;font-size:.7rem;color:#666}
.clg i{width:14px;height:3px;border-radius:2px;display:block}
.chartbox svg{width:100%;height:auto;display:block;touch-action:manipulation}
.cinfo{margin:6px 4px 2px;padding-top:7px;border-top:1px solid #eef0f5;font-size:.74rem;color:#555;line-height:1.5;min-height:34px}
.cinfo b{color:#1a1a2e}
.cinfo span{white-space:nowrap;font-weight:700}
.chint{font-size:.66rem;color:#a8afbc;margin:2px 4px 0}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:10px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
table{border-collapse:separate;border-spacing:0;background:#fff;width:max-content;min-width:100%}
thead th{background:var(--blue);color:#fff;font-size:.7rem;font-weight:600;padding:8px 9px;text-align:center;white-space:nowrap}
thead tr.sub th{background:#232946;font-size:.66rem;font-weight:500;padding:6px 8px;border-bottom:2px solid var(--accent)}
th.s{border-left:2px solid var(--accent)}
tbody tr:nth-child(even){background:#fafbff}
td{padding:7px 8px;font-size:.78rem;text-align:center;border-bottom:1px solid #eee;vertical-align:middle;white-space:nowrap}
td.dc{font-weight:700;background:#f7f9ff!important;border-right:2px solid #dde4f5;color:#222;min-width:76px;text-align:left;padding-left:9px;position:sticky;left:0;z-index:5}
td.s{border-left:2px solid #eef1fb}
td.ok{background:var(--gk)!important;color:var(--gv);font-weight:700}
td.nok{background:var(--rk)!important;color:var(--rv);font-weight:700}
td.na{background:#f0f0f0!important;color:#aaa;font-size:.7rem;font-style:italic}
.chip{display:block;padding:3px 7px;border-radius:5px;margin:2px auto;font-weight:700;font-size:.76rem;width:fit-content}
.cok{background:var(--gk);color:var(--gv)}.cnok{background:var(--rk);color:var(--rv)}.cna{background:#f0f0f0;color:#aaa}
tr.avg-row td{background:#eaf1fd!important;font-weight:800;border-bottom:2px solid var(--accent)}
tr.avg-row td.dc{background:#dce9fb!important;color:#16386b}
small{font-size:.68rem;color:#888;font-weight:400}
.note{font-size:.7rem;color:#8a93a5;margin-top:12px;line-height:1.65}
@media(max-width:620px){
 header{padding:12px 13px}
 header h1{font-size:.9rem}
 header span{font-size:.74rem;display:block;margin-top:2px}
 .panel,.content{padding-left:9px;padding-right:9px}
 .pbtn{min-width:0;flex:1 1 22%;padding:9px 4px;font-size:.72rem}
 #idInput{font-size:1.15rem;padding:12px}
 .kpis{grid-template-columns:repeat(2,1fr);gap:6px}
 .kpi .v{font-size:1rem}
 .kpi .l{font-size:.62rem}
 .tscroll{overflow-x:hidden!important;box-shadow:0 1px 6px rgba(0,0,0,.08)}
 table{width:100%!important;min-width:0!important;table-layout:fixed}
 thead th{font-size:.54rem;padding:5px 1px;white-space:normal;line-height:1.2;word-break:break-word}
 thead tr.sub th{font-size:.5rem;padding:4px 1px;line-height:1.15}

 .chip{font-size:.55rem;padding:1px 2px;width:100%}
 small{font-size:.48rem}
 .chartbox{padding:10px 6px 4px}
}
</style>

var PA=250.0, RB=420.0;
var _period=15, _cur=null, _pts=[], _geo=null;

function setPeriod(p){
  _period=p;
  var b=document.querySelectorAll('.pbtn');
  for(var i=0;i<b.length;i++) b[i].classList.toggle('active', b[i].getAttribute('data-p')==p);
  if(_cur) render(_cur);
}
function num(v){return v==null?null:Math.round(v);}
function pct(v){return v==null?null:Math.round(v*100);}

function prodCell(pa,pau,rb,rbu){
  if(pa==null&&rb==null) return '<td class="s"><span class="chip cna">-</span></td>';
  var h='<td class="s">';
  if(pa!=null&&pau>0) h+='<span class="chip '+(pa>=PA?'cok':'cnok')+'">&#128230; '+num(pa)+'</span>';
  if(rb!=null&&rbu>0) h+='<span class="chip '+(rb>=RB?'cok':'cnok')+'">&#129302; '+num(rb)+'</span>';
  if(h==='<td class="s">') h+='<span class="chip cna">-</span>';
  return h+'</td>';
}
var UT=75;
function utCell(ut){
  if(ut==null) return '<td class="na">-</td>';
  var p=pct(ut);
  return '<td class="'+(p>=UT?'ok':'nok')+'">'+p+'%</td>';
}
function unitsCell(pau,rbu){
  if(pau==null&&rbu==null) return '<td class="na">-</td>';
  return '<td>'+((pau||0)+(rbu||0)).toLocaleString('pt-BR')+'</td>';
}
function bipCell(bip,st,mn){
  if(!bip) return '<td class="s na">-</td>';
  if(st==='ON_TIME') return '<td class="s ok">'+bip+'</td>';
  return '<td class="s nok">'+bip+'<br><small style="color:#8b0000">+'+mn+' min</small></td>';
}

function chart(rows){
  var pts=rows.slice().reverse().filter(function(r){
    return (r.pa!=null&&r.pau>0)||(r.rb!=null&&r.rbu>0)||(r.ut!=null);
  });
  if(pts.length<2){_pts=[];return '';}
  var narrow = (window.innerWidth||640) < 620;
  var maxLab = narrow ? 6 : 12;
  var step   = Math.ceil(pts.length/maxLab);
  var rot    = pts.length>14;
  var W=640,H=rot?216:200,ml=34,mr=12,mt=12,mb=rot?42:28;
  var iw=W-ml-mr, ih=H-mt-mb;
  var vals=[];
  pts.forEach(function(r){
    if(r.pa!=null&&r.pau>0) vals.push(r.pa/PA*100);
    if(r.rb!=null&&r.rbu>0) vals.push(r.rb/RB*100);
    if(r.ut!=null) vals.push(r.ut*100);
  });
  var top=Math.max(120,Math.ceil(Math.max.apply(null,vals)/25)*25);
  function X(i){return ml+(pts.length===1?iw/2:iw*i/(pts.length-1));}
  function Y(v){return mt+ih-(v/top*ih);}
  function isLab(i){return i===pts.length-1 || i%step===0;}

  var grid='',i;
  for(i=0;i<=top;i+=(top>150?50:25)){
    grid+='<line x1="'+ml+'" y1="'+Y(i)+'" x2="'+(W-mr)+'" y2="'+Y(i)+'" stroke="#eceff5" stroke-width="1"/>'+
          '<text x="'+(ml-6)+'" y="'+(Y(i)+4)+'" text-anchor="end" font-size="10" fill="#9aa1ae">'+i+'%</text>';
  }
  var vgrid='', xl='';
  for(i=0;i<pts.length;i++){
    var x=X(i).toFixed(1), lab=isLab(i);
    vgrid+='<line x1="'+x+'" y1="'+mt+'" x2="'+x+'" y2="'+(mt+ih)+'" stroke="'+(lab?'#d9dee9':'#eceff5')+
           '" stroke-width="1" stroke-dasharray="3 3"/>';
    if(lab){
      if(rot) xl+='<text x="'+x+'" y="'+(mt+ih+14)+'" text-anchor="end" font-size="10" fill="#7b8494" transform="rotate(-40 '+x+' '+(mt+ih+14)+')">'+pts[i].d+'</text>';
      else    xl+='<text x="'+x+'" y="'+(mt+ih+15)+'" text-anchor="middle" font-size="10" fill="#7b8494">'+pts[i].d+'</text>';
    }
  }
  vgrid+='<line x1="'+ml+'" y1="'+(mt+ih)+'" x2="'+(W-mr)+'" y2="'+(mt+ih)+'" stroke="#c3c9d6" stroke-width="1"/>';
  grid+='<line x1="'+ml+'" y1="'+Y(100)+'" x2="'+(W-mr)+'" y2="'+Y(100)+'" stroke="#b0b8c8" stroke-width="1.2" stroke-dasharray="6 4"/>';

  function path(get,color){
    var d='',n=0,dots='';
    pts.forEach(function(r,i){
      var v=get(r); if(v==null) return;
      d+=(n===0?'M':'L')+X(i).toFixed(1)+' '+Y(v).toFixed(1)+' '; n++;
      dots+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(v).toFixed(1)+'" r="'+(pts.length>30?2:2.8)+'" fill="'+color+'"/>';
    });
    if(n===0) return '';
    return '<path d="'+d+'" fill="none" stroke="'+color+'" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>'+dots;
  }
  _pts=pts; _geo={ml:ml,iw:iw,n:pts.length,mt:mt,ih:ih,W:W};
  var hl='<line id="chartHL" x1="0" y1="'+mt+'" x2="0" y2="'+(mt+ih)+'" stroke="#4a90e2" stroke-width="1.6" opacity="0"/>';
  function media(get){
    var a=[]; pts.forEach(function(r){var v=get(r); if(v!=null) a.push(v);});
    return a.length? a.reduce(function(x,y){return x+y;},0)/a.length : null;
  }
  var mPA=media(function(r){return (r.pa!=null&&r.pau>0)?r.pa/PA*100:null;});
  var mRB=media(function(r){return (r.rb!=null&&r.rbu>0)?r.rb/RB*100:null;});
  var mUT=media(function(r){return r.ut!=null?r.ut*100:null;});
  function lg(cor,txt,v){
    return '<span><i style="background:'+cor+'"></i>'+txt+' &middot; '+
      (v!=null?'<b>'+Math.round(v)+'%</b>':'<span style="color:#b6bcc8">sem registro</span>')+'</span>';
  }
  return '<div class="chartbox"><h3>Evolu&ccedil;&atilde;o &mdash; m&eacute;dia dos &uacute;ltimos '+_period+' dias '+
    '<span style="font-weight:400;color:#98a0ae">('+pts.length+' '+(pts.length===1?'dia':'dias')+' com registro)</span></h3>'+
    '<div class="clg">'+
      lg('var(--prod)','&#128230; Putaway',mPA)+
      lg('var(--rob)','&#129302; Robotics',mRB)+
      lg('var(--util)','Utiliza&ccedil;&atilde;o',mUT)+
    '</div>'+
    '<svg viewBox="0 0 '+W+' '+H+'" style="cursor:crosshair" onclick="chartAt(event,this)" onmousemove="chartAt(event,this)" ontouchstart="chartAt(event,this)" ontouchmove="chartAt(event,this)" role="img" aria-label="Linhas de evolucao: produtividade de putaway, de robotics e utilizacao, todas em percentual da meta, com uma marcacao vertical por dia">'+
    grid+vgrid+hl+xl+
    path(function(r){return (r.pa!=null&&r.pau>0)?r.pa/PA*100:null;},'#2a78d6')+
    path(function(r){return (r.rb!=null&&r.rbu>0)?r.rb/RB*100:null;},'#7f4fd8')+
    path(function(r){return r.ut!=null?r.ut*100:null;},'#eb6834')+
    '</svg>'+
    '<div class="cinfo" id="chartInfo"></div>'+
    '<p class="chint">Toque ou arraste o dedo sobre o gr&aacute;fico para ver os n&uacute;meros de cada dia.</p>'+
    '</div>';
}

function chartAt(e,svg){
  if(!_geo||!_pts.length) return;
  var t=(e.touches&&e.touches[0])||e;
  var b=svg.getBoundingClientRect();
  if(!b.width) return;
  var vx=(t.clientX-b.left)/b.width*_geo.W;
  var passo=_geo.iw/Math.max(_geo.n-1,1);
  var i=Math.round((vx-_geo.ml)/passo);
  if(i<0) i=0;
  if(i>_pts.length-1) i=_pts.length-1;
  chartPick(i);
}

function chartPick(i){
  var r=_pts[i]; if(!r||!_geo) return;
  var x=_geo.ml+(_geo.n===1?_geo.iw/2:_geo.iw*i/(_geo.n-1));
  var hl=document.getElementById('chartHL');
  if(hl){hl.setAttribute('x1',x);hl.setAttribute('x2',x);hl.setAttribute('opacity','1');}
  var el=document.getElementById('chartInfo'); if(!el) return;
  var p=[];
  if(r.pa!=null&&r.pau>0) p.push('<span style="color:#2a78d6">&#128230; '+Math.round(r.pa)+' un/h &middot; '+Math.round(r.pa/PA*100)+'%</span>');
  if(r.rb!=null&&r.rbu>0) p.push('<span style="color:#7f4fd8">&#129302; '+Math.round(r.rb)+' un/h &middot; '+Math.round(r.rb/RB*100)+'%</span>');
  if(r.ut!=null) p.push('<span style="color:#eb6834">Utiliz. '+Math.round(r.ut*100)+'%</span>');
  var un=(r.pau||0)+(r.rbu||0);
  if(un) p.push('<span style="color:#6b7280">'+un.toLocaleString('pt-BR')+' un.</span>');
  el.innerHTML='<b>'+r.d+' '+r.wd+'</b> &nbsp;'+(p.length?p.join(' &nbsp; '):'<span style="color:#b6bcc8;font-weight:400">sem registro</span>');
}

function render(k){
  var m=MEMBERS[k];
  var rows=m.r.filter(function(r){return r.da<_period;});
  var pas=[],rbs=[],uts=[],un=0,fsOk=0,fsTot=0,sfOk=0,sfTot=0;
  rows.forEach(function(r){
    if(r.pa!=null&&r.pau>0) pas.push(r.pa);
    if(r.rb!=null&&r.rbu>0) rbs.push(r.rb);
    if(r.ut!=null) uts.push(r.ut);
    un+=(r.pau||0)+(r.rbu||0);
    if(r.fst){fsTot++; if(r.fst==='ON_TIME')fsOk++;}
    if(r.sst){sfTot++; if(r.sst==='ON_TIME')sfOk++;}
  });
  function avg(a){return a.length?a.reduce(function(x,y){return x+y;},0)/a.length:null;}
  var apa=avg(pas), arb=avg(rbs), aut=avg(uts);

  var h='<div class="card"><span class="cid">ID '+k+'</span><span class="badge">ATIVO</span></div>';
  h+='<div class="kpis">'+
     '<div class="kpi"><div class="l">Prod. l&iacute;q. m&eacute;dia (PA)</div><div class="v">'+(apa!=null?num(apa):'&mdash;')+'</div></div>'+
     '<div class="kpi"><div class="l">Prod. l&iacute;q. m&eacute;dia (RB)</div><div class="v">'+(arb!=null?num(arb):'&mdash;')+'</div></div>'+
     '<div class="kpi"><div class="l">Utiliza&ccedil;&atilde;o m&eacute;dia<br><span style="font-size:.9em">meta 75%</span></div><div class="v"'+(aut!=null?' style="color:'+(pct(aut)>=UT?'#1a5c1a':'#8b0000')+'"':'')+'>'+(aut!=null?pct(aut)+'%':'&mdash;')+'</div></div>'+
     '<div class="kpi"><div class="l">Unidades no per&iacute;odo</div><div class="v">'+un.toLocaleString('pt-BR')+'</div></div>'+
     '<div class="kpi"><div class="l">1&ordm; BIP no prazo</div><div class="v">'+(fsTot?Math.round(fsOk*100/fsTot)+'%':'&mdash;')+'</div></div>'+
     '<div class="kpi"><div class="l">&Uacute;lt. BIP no prazo</div><div class="v">'+(sfTot?Math.round(sfOk*100/sfTot)+'%':'&mdash;')+'</div></div>'+
     '</div>';

  h+=chart(rows);

  h+='<div class="tscroll"><table>'+
     '<colgroup><col><col><col class="c-ut"><col class="c-un"><col><col></colgroup>'+
     '<thead><tr>'+
     '<th rowspan="2" style="min-width:76px;text-align:left;padding-left:9px;position:sticky;left:0;z-index:15;background:#1a1a2e">DATA</th>'+
     '<th colspan="3" class="s">PERFORMANCE</th><th colspan="2" class="s">SETUP TIME</th></tr>'+
     '<tr class="sub"><th class="s">Prod. L&iacute;q.<br><small>PA&gt;'+num(PA)+' / RB&gt;'+num(RB)+'</small></th>'+
     '<th>Utiliz.<br><small>Meta: 75%</small></th><th>Unid. proc.</th>'+
     '<th class="s">1&ordm; BIP<br><small>Meta: 09:10</small></th>'+
     '<th>&Uacute;lt. BIP<br><small>Meta: 18:43</small></th></tr></thead><tbody>';

  h+='<tr class="avg-row"><td class="dc">M&Eacute;DIA</td>'+
     '<td class="s">'+(apa!=null?'<span class="chip '+(apa>=PA?'cok':'cnok')+'">&#128230; '+num(apa)+'</span>':'')+
     (arb!=null?'<span class="chip '+(arb>=RB?'cok':'cnok')+'">&#129302; '+num(arb)+'</span>':'')+
     ((apa==null&&arb==null)?'<span class="chip cna">-</span>':'')+'</td>'+
     '<td'+(aut!=null?' class="'+(pct(aut)>=UT?'ok':'nok')+'"':'')+'>'+(aut!=null?pct(aut)+'%':'-')+'</td>'+
     '<td>'+un.toLocaleString('pt-BR')+'</td>'+
     '<td class="s">'+(fsTot?Math.round(fsOk*100/fsTot)+'% OK':'-')+'</td>'+
     '<td>'+(sfTot?Math.round(sfOk*100/sfTot)+'% OK':'-')+'</td></tr>';

  if(rows.length===0){
    h+='<tr><td colspan="6" style="color:#aaa;padding:20px">Sem dados no per&iacute;odo</td></tr>';
  } else {
    rows.forEach(function(r){
      h+='<tr><td class="dc">'+r.d+' <small>'+r.wd+'</small></td>'+
         prodCell(r.pa,r.pau,r.rb,r.rbu)+utCell(r.ut)+unitsCell(r.pau,r.rbu)+
         bipCell(r.fb,r.fst,r.fw)+bipCell(r.lb,r.sst,r.sw)+'</tr>';
    });
  }
  h+='</tbody></table></div>';
  h+='<p class="note">&#128230; putaway &middot; &#129302; putaway robotics. Prod. l&iacute;quida = unidades / (tempo de processo + TND + ociosidade estendida). Utiliza&ccedil;&atilde;o = dura&ccedil;&atilde;o efetiva / tempo sist&ecirc;mico (meta 75%).<br>'+
     'Setup time = hora do bip registrada. Meta: 1&ordm; bip at&eacute; 09:10 e &uacute;ltimo ap&oacute;s 18:43 (turno padr&atilde;o 09:00&ndash;18:48). Vermelho mostra os minutos perdidos.<br>'+
     'Fonte: BigQuery &middot; meli-bi-data.WHOWNER.DM_OPS_ONE_POLARIS e DM_OPS_FAST_START_STRONG_FINISH.</p>';
  document.getElementById('results').innerHTML=h;
  if(_pts.length) chartPick(_pts.length-1);
}

window.addEventListener('resize',function(){
  clearTimeout(window._rt);
  window._rt=setTimeout(function(){ if(_cur) render(_cur); },200);
});

function go(){
  var v=(document.getElementById('idInput').value||'').trim();
  var err=document.getElementById('errMsg');
  err.style.display='none';
  if(!v) return;
  if(!MEMBERS[v]){err.textContent='ID '+v+' não encontrado nesta base';err.style.display='block';return;}
  _cur=v; render(v);
  var res=document.getElementById('results');
  if(res.scrollIntoView) res.scrollIntoView({behavior:'smooth',block:'start'});
}
</script>
</body>
</html>
